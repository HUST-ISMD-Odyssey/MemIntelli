[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memintelli"
version = "2.0.0"
authors = [
    {name = "Odysseia", email = "1548384176@qq.com"},
]
description = "Bit-sliced memristor neural network simulation with Triton and PyTorch backends"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.9,<2.12",
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "tqdm>=4.66,<5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/HUST-ISMD-Odyssey/MemIntelli"
Repository = "https://github.com/HUST-ISMD-Odyssey/MemIntelli"

[project.optional-dependencies]
triton = ["triton>=3.5,<3.7; sys_platform == 'linux'"]
vision = ["torchvision>=0.24,<0.27", "Pillow>=10"]
speech = ["torchaudio>=2.9,<2.12", "soundfile>=0.13,<0.14"]
llm = ["transformers>=4.51,<6", "safetensors>=0.5"]
yolo = ["torchvision>=0.24,<0.27", "opencv-python-headless>=4.10", "PyYAML>=6", "scipy>=1.12", "pandas>=2", "requests>=2.31", "psutil>=6", "seaborn>=0.13", "thop>=0.1.1", "GitPython>=3.1", "ipython>=8", "setuptools<81"]

[tool.setuptools.packages.find]
include = ["memintelli*"]

[tool.setuptools]
zip-safe = false
